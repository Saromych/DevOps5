apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: crud-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: docker.io/library/postgres:15-alpine
        imagePullPolicy: Never
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          value: "postgres"
        - name: POSTGRES_DB
          value: "cruddb"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: crud-demo
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
